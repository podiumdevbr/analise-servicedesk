name: Manter Streamlit Acordado

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite executar manualmente pelo painel do GitHub, se quiser

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer requisição HTTP para a URL do Streamlit
        run: |
          curl -sI "https://servicedesktrepb.streamlit.app" | head -n 1
      - name: Ping 1500 Dashboard
        run: |
          curl -sI "https://dashboard1500.streamlit.app" | head -n 1